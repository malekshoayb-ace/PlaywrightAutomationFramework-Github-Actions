name: Playwright Test Automation Framework

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
          - edge

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    
    - name: Create reports directory
      run: mkdir -p reports/screenshots
    
    - name: Run Playwright tests
      env:
        NODE_ENV: ${{ github.event.inputs.environment || 'dev' }}
        CI: true
      run: |
        if [ "${{ github.event.inputs.browser }}" != "" ] && [ "${{ github.event.inputs.browser }}" != "all" ]; then
          npx playwright test --project=${{ github.event.inputs.browser }}
        else
          npx playwright test --project=${{ matrix.project }}
        fi
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ matrix.project }}
        path: |
          reports/
          allure-results/
        retention-days: 30
    
    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots-${{ matrix.project }}
        path: reports/screenshots/
        retention-days: 7
  
  generate-report:
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    
    - name: Install Allure
      run: |
        sudo apt-get update
        sudo apt-get install default-jre -y
        wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure
    
    - name: Generate Allure Report
      run: |
        mkdir -p allure-results-combined
        find . -name "allure-results" -type d -exec cp -r {}/* allure-results-combined/ \;
        allure generate allure-results-combined --clean -o allure-report
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      env:
        GH_PAGES_PAT: ${{ secrets.GH_PAGES_PAT }}
      run: |
        git config --global user.name 'malekshoayb-ace'
        git config --global user.email 'malekshoayb.ace@gmail.com'
        git remote set-url origin https://x-access-token:${GH_PAGES_PAT}@github.com/${{ github.repository }}
        git checkout --orphan gh-pages
        git rm -rf .
        cp -r allure-report/* .
        git add .
        git commit -m "Deploy Allure report to GitHub Pages"
        git push -f origin gh-pages
  
  notify:
    needs: [test, generate-report]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Notify on success
      if: needs.test.result == 'success'
      run: echo "✅ All tests passed successfully!"
    
    - name: Notify on failure
      if: needs.test.result == 'failure'
      run: echo "❌ Some tests failed. Check the reports for details."
