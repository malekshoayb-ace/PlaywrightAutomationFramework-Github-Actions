name: Playwright Test Automation Framework

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write
  pages: write

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npx playwright test

      - name: Upload Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            reports/
            allure-results/
          retention-days: 30

  generate-report:
    name: Generate & Deploy Allure Report
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: playwright-results
          path: ./artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Dependencies
        run: npm ci

      - name: Install Allure Commandline
        run: |
          sudo apt-get update
          sudo apt-get install default-jre -y
          wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
          tar -zxvf allure-2.24.0.tgz
          sudo mv allure-2.24.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Prepare Allure Results
        run: |
          mkdir -p allure-results
          find ./artifacts -type d -name "allure-results" -exec cp -r {}/* allure-results/ \; 2>/dev/null || true
          echo "Allure results collected:"
          ls -R allure-results || echo "No allure-results found!"

      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report
          ls -R allure-report || echo "Report generation failed!"

      - name: Upload Allure Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: test-reports

      - name: Send Report to TestDino
        if: always()
        run: |
          curl -X POST "https://api.testdino.com/reports" \
            -H "Authorization: Bearer trx_production_6c9babbff3100945abf9bea16239a45ed896eebb40174fe7ce4487311beee6d2" \
            -H "Content-Type: application/json" \
            -d '{
              "project": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "reportUrl": "https://${{ github.repository_owner }}.github.io/$(echo "${{ github.repository }}" | cut -d"/" -f2)/test-reports/"
            }'

      - name: Display Report URL
        if: github.ref == 'refs/heads/main'
        run: |
          echo "✅ Allure Report is published!"
          echo "🔗 View it here:"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "https://${{ github.repository_owner }}.github.io/${REPO_NAME}/test-reports/"
